<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control — Rueda BART</title>
  <style>
    body { font-family: -apple-system, sans-serif; background:#1a1a18; color:#fff;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh; margin:0; text-align:center; }
    #startBtn { background:#0072B2; color:#fff; border:none; border-radius:12px;
      padding:1rem 2rem; font-size:1.1rem; margin-bottom:2rem; }
    #angle { font-family: monospace; font-size: 3rem; margin-top: 1rem; }
    #status { font-size:0.8rem; color:#999; }
  </style>
</head>
<body>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>

  <h1>Gira la rueda</h1>
  <button id="startBtn">Activar sensor</button>
  <div id="status"></div>
  <div id="angle">--°</div>

  <script>
    let smoothed = null;
    let totalRotation = 0;

    function normalize(a) { a = a % 360; return a < 0 ? a + 360 : a; }

    function handleOrientation(event) {
      let heading = event.webkitCompassHeading;
      if (heading === undefined || heading === null) heading = 360 - event.alpha;

      if (smoothed === null) {
        smoothed = heading;
      } else {
        let diff = heading - smoothed;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        smoothed = normalize(smoothed + diff * 0.25);
        totalRotation += diff * 0.25; // se acumula sin límite, puede crecer o ser negativo
      }

      document.getElementById('angle').textContent = Math.round(totalRotation) + '°';
      Protobject.Core.send(totalRotation).to("index.html");
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      const st = document.getElementById('status');
      try {
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          await DeviceMotionEvent.requestPermission();
        }
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          const r = await DeviceOrientationEvent.requestPermission();
          if (r !== 'granted') { st.textContent = 'Permiso denegado'; return; }
        }
        window.addEventListener('deviceorientation', handleOrientation, true);
        st.textContent = 'Sensor activo';
        document.getElementById('startBtn').style.display = 'none';
      } catch (err) {
        st.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
